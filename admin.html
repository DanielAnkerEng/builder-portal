<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin-oversikt | Wreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/builder.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div id="adminShell"><p class="admin-guard-loading" role="status">Laster arbeidsområde …</p></div>
<section id="adminLegacyContent" hidden>
  <div class="admin-main-inner">

    <div class="admin-head">
      <div>
        <h2>Nettsideprosjekter</h2>
        <p class="admin-sub">Eksisterende prosjektoversikt. Kunde- og dashboardmoduler utvides i senere faser.</p>
      </div>
      <button class="btn btn-primary" id="newAccountBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Opprett prosjekt
      </button>
    </div>

    <div class="admin-stats">
      <div class="admin-stat"><span class="n" id="statTotal">Laster …</span><span class="l">Nettsideprosjekter</span></div>
      <div class="admin-stat"><span class="n" id="statLive">Laster …</span><span class="l">Med publikasjon</span></div>
      <div class="admin-stat"><span class="n" id="statDraft">Laster …</span><span class="l">Uten publikasjon</span></div>
    </div>

    <p class="admin-overview-status" id="adminOverviewStatus" role="status" aria-live="polite">Laster kontooversikt …</p>

    <div class="account-grid" id="accountGrid"></div>

  </div>
</section>

<!-- NEW ACCOUNT MODAL -->
<div class="modal-overlay" id="newAccountModal" role="dialog" aria-modal="true" aria-labelledby="newAccountTitle" tabindex="-1">
  <div class="modal modal-form">
    <div class="code-modal-head">
      <div>
        <h3 id="newAccountTitle">Opprett nytt prosjekt</h3>
        <p class="code-modal-sub">Kunden får sin egen nettside å redigere.</p>
      </div>
      <button class="icon-btn" id="closeNewAccountModal" aria-label="Lukk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="newAccountForm" class="field-group">
      <label class="b-field">
        <span>Kontaktperson</span>
        <input type="text" id="na-displayname" placeholder="f.eks. Anna Hansen" required>
      </label>
      <label class="b-field">
        <span>E-post</span>
        <input type="email" id="na-email" autocomplete="off" placeholder="anna@bedrift.no" required>
      </label>
      <label class="b-field">
        <span>Bedrifts-/prosjektnavn</span>
        <input type="text" id="na-projectname" placeholder="f.eks. Annas Bakeri" required>
      </label>
      <label class="b-field">
  <span>Offentlig nettadresse</span>
  <input
    type="text"
    id="na-public-slug"
    placeholder="annas-bakeri"
    pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
    autocomplete="off"
    required
  >
</label>
      <label class="b-field">
        <span>Bransje (valg av startmal er ikke aktivert ennå)</span>
        <select id="na-template"></select>
      </label>
      <p class="auth-error" id="newAccountError"></p>
      <button type="submit" class="btn btn-primary btn-full">Opprett konto</button>
    </form>
  </div>
</div>

<script src="js/builder-data.js?v=security2"></script>
<script type="module" src="js/admin.js?v=security2"></script>
</body>
</html>
