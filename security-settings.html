<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sikkerhetsinnstillinger | Wreach</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/login.css"></head><body class="auth-body"><main class="auth-wrap"><a href="builder.html" class="logo auth-logo">Wreach</a><section class="auth-card"><div class="eyebrow">Security V2</div><h1>Personlig sikkerhetsnøkkel</h1><p class="auth-sub">Nøkkelen kreves når du publiserer og lagres aldri i klartekst.</p><form id="keyForm" class="auth-form"><label class="field"><span>Nåværende nøkkel (ved rotasjon)</span><input id="currentKey" type="password" autocomplete="current-password"></label><label class="field"><span>Ny nøkkel</span><input id="newKey" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label class="field"><span>Gjenta ny nøkkel</span><input id="confirmKey" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><p class="auth-error" id="keyError"></p><button class="btn btn-primary btn-large btn-full">Lagre sikkerhetsnøkkel</button></form></section></main><script type="module" src="js/security-settings.js"></script></body></html>
