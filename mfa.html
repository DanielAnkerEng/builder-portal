<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tofaktorautentisering | Wreach</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/login.css"></head><body class="auth-body"><main class="auth-wrap"><a href="index.html" class="logo auth-logo">Wreach</a><section class="auth-card"><div class="eyebrow">Security V2</div><h1 id="mfaTitle">Bekreft tofaktor</h1><p class="auth-sub" id="mfaHelp">Åpne autentiseringsappen din.</p><div id="enrollment" hidden><img id="mfaQr" alt="QR-kode for autentiseringsapp" width="220" height="220"><p>Manuell kode: <code id="mfaSecret"></code></p></div><form id="mfaForm" class="auth-form"><label class="field"><span>6-sifret kode</span><input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><p class="auth-error" id="mfaError"></p><button class="btn btn-primary btn-large btn-full" type="submit">Bekreft og fortsett</button></form><button class="btn btn-ghost btn-full" id="mfaLogout" type="button">Logg ut</button></section></main><script type="module" src="js/mfa.js"></script></body></html>
