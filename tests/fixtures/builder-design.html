<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Kundeområde · kun lokal designvisning</title>
  <link rel="stylesheet" href="../../css/public-fonts.css">
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/builder.css">
  <link rel="stylesheet" href="../../css/portal-theme.css">
</head>
<body class="builder-body">
  <!-- Static presentation only. No script, Auth client, session, real data or write action. -->
  <header class="topbar">
    <div class="topbar-left"><a class="logo" href="../../index.html">Wreach</a><div class="topbar-divider"></div><span class="project-name-input">Eksempelprosjekt</span><span class="owner-tag">DEMO DATA · ikke en konto</span></div>
    <div class="topbar-center"><div class="view-toggle"><button class="view-btn active" disabled>Desktop</button><button class="view-btn" disabled>Mobil</button></div></div>
    <div class="topbar-right"><span class="save-status">Kun designvisning · ingen lagring</span><button class="btn btn-ghost btn-small" disabled>Lagre</button><button class="btn btn-ghost btn-small" disabled>Se nettside</button><button class="btn btn-primary btn-small" disabled>Publiser</button><div class="user-menu"><button class="user-avatar" disabled aria-label="Ingen innlogget bruker">D</button></div></div>
  </header>
  <main class="builder-shell">
    <aside class="sidebar" aria-label="Nettsideverktøy – inaktiv designvisning">
      <nav class="sidebar-tabs"><button class="sidebar-tab" disabled>Sider</button><button class="sidebar-tab active" disabled>Oppsett</button><button class="sidebar-tab" disabled>Innhold</button><button class="sidebar-tab" disabled>Seksjoner</button></nav>
      <div class="sidebar-panels"><section class="panel active">
        <h1 class="panel-title">Nettside-oppsett</h1><p class="panel-desc">Syntetisk presentasjon av kundeområdet. Ingen innlogging, session eller datatilgang.</p>
        <div class="field-group">
          <label class="b-field"><span>Domene</span><input type="text" value="eksempel.invalid" readonly></label>
          <label class="b-field"><span>Bransje</span><select disabled><option>Eksempel</option></select></label>
          <label class="b-field"><span>Språk</span><select disabled><option>Norsk (bokmål)</option></select></label>
          <label class="b-field"><span>Status</span><select disabled><option>Privat utkast</option></select></label>
        </div><div class="field-divider"></div>
        <div class="field-group"><label class="b-field"><span>SEO-tittel</span><input type="text" value="Eksempelprosjekt" readonly></label><label class="b-field"><span>SEO-beskrivelse</span><textarea rows="3" readonly>Kun syntetiske verdier i denne designvisningen.</textarea></label></div>
      </section></div>
      <div class="customer-save-bar"><div><strong>Ditt arbeidsområde</strong><span>DEMO DATA · Ingen endringer kan lagres her</span></div><button class="btn btn-primary btn-full" disabled>Lagre utkast</button></div>
    </aside>
    <section class="canvas" aria-label="Plassholder for forhåndsvisning">
      <div class="canvas-inner"><div class="mockup-stage"><div class="mockup-desktop"><div class="browser-bar">eksempel.invalid · DEMO DATA</div><img src="../../assets/marketing/estate-house-1600.webp" alt="Illustrasjonsfoto i en inaktiv designvisning" width="1600" height="1067"></div><div class="mockup-mobile"><img src="../../assets/marketing/estate-house-640.webp" alt="Illustrasjonsfoto – mobil forhåndsvisning" width="640" height="427"></div></div></div>
    </section>
  </main>
</body>
</html>
