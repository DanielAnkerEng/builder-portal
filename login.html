<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logg inn | Studio Nord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">

<div class="noise-overlay"></div>

<div class="auth-bg">
  <div class="hero-glow glow-1"></div>
  <div class="hero-glow glow-2"></div>
</div>

<div class="auth-wrap">
  <a href="index.html" class="logo auth-logo">Studio<span>Nord</span></a>

  <div class="auth-card">
    <div class="eyebrow">Kundeportal</div>
    <h1>Logg inn</h1>
    <p class="auth-sub">Logg inn for å fortsette på nettsidebyggeren din.</p>

    <form id="loginForm" class="auth-form">
      <label class="field">
        <span>Brukernavn / e-post</span>
        <input type="text" id="email" placeholder="admin eller deg@bedrift.no" required>
      </label>
      <label class="field">
        <span>Passord</span>
        <input type="password" id="password" placeholder="••••••••" required>
      </label>
      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" id="remember">
          <span>Husk meg</span>
        </label>
        <a href="#" class="link-muted" id="forgotLink">Glemt passord?</a>
      </div>
      <p class="auth-error" id="authError"></p>
      <button type="submit" class="btn btn-primary btn-large btn-full">
        <span>Logg inn</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <div class="auth-divider"><span>eller test med demo-konto</span></div>

    <div class="demo-login-row">
      <button class="btn btn-ghost btn-large" id="adminLoginBtn">
        🛠️ Logg inn som Admin
      </button>
      <button class="btn btn-ghost btn-large" id="userLoginBtn">
        👤 Logg inn som Kunde
      </button>
      <button class="btn btn-ghost btn-large fjord-login" id="fjordLoginBtn">
        ⛵ Test Fjord Eiendom
      </button>
    </div>

    <p class="auth-footnote">Testkunder: <strong>fjord/fjord123</strong>, <strong>salong/salong123</strong>, <strong>ror/ror123</strong>, <strong>tall/tall123</strong> og <strong>smak/smak123</strong>. Admin: <strong>admin/123</strong>.</p>
  </div>

  <p class="auth-back"><a href="index.html">&larr; Tilbake til forsiden</a></p>
</div>

<script src="builder-data.js?v=demo2"></script>
<script src="accounts.js?v=demo2"></script>
<script src="login.js?v=demo2"></script>
</body>
</html>
