<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logg inn | Wreach</title>
<link rel="stylesheet" href="css/public-fonts.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/portal-theme.css">
</head>
<body class="auth-body auth-login">

<main class="auth-layout">
  <aside class="auth-story" aria-label="Velkommen til Wreach">
    <img src="assets/marketing/wreach-design-desk-1024.webp" srcset="assets/marketing/wreach-design-desk-640.webp 640w, assets/marketing/wreach-design-desk-1024.webp 1024w" sizes="(max-width: 640px) 100vw, 53vw" alt="" width="1024" height="1536" fetchpriority="high">
    <a href="index.html" class="logo auth-logo">W<span>reach</span></a>
    <div class="auth-story-copy">
      <p class="eyebrow">Din nettside. Ditt uttrykk.</p>
      <h2>Velkommen tilbake.</h2>
    </div>
    <div class="auth-story-footer"><span>Wreach / Kundeportal</span><span aria-hidden="true">↗</span></div>
  </aside>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">Kundeportal</div>
    <h1>Logg inn</h1>
    <p class="auth-sub">Logg inn for å fortsette på nettsidebyggeren din.</p>

    <form id="loginForm" class="auth-form">
      <label class="field">
        <span>E-post</span>
        <input type="email" id="email" autocomplete="username" placeholder="deg@bedrift.no" required>
      </label>
      <label class="field">
        <span>Passord</span>
        <input type="password" id="password" placeholder="••••••••" required>
      </label>
      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" id="remember">
          <span>Husk meg</span>
        </label>
        <a href="#" class="link-muted" id="forgotLink">Glemt passord?</a>
      </div>
      <p class="auth-error" id="authError" role="status" aria-live="polite" aria-atomic="true"></p>
      <button type="submit" class="btn btn-primary btn-large btn-full">
        <span>Logg inn</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>

    <p class="auth-footnote">Alle Wreach-kontoer krever passord og verifisert tofaktorautentisering.</p>
  </div>

  <p class="auth-back"><a href="index.html">&larr; Tilbake til forsiden</a></p>
</div>
</main>

<script type="module" src="js/login.js?v=security2"></script>
</body>
</html>
